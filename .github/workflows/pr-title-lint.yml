name: PR Title Lint

# Enforces Conventional Commits on PR titles. PRs are squash-merged (see repo
# merge settings), so the PR title becomes the single commit on main -
# release-please parses that commit to decide version bumps and changelog
# entries. Without this check, non-conventional titles land on main and
# release-please has nothing to act on.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
